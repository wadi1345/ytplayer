<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天道金鑰測試儀 (高級金鑰版)</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; padding: 20px;">
    <h2>🔮 天道金鑰測試儀 (高級金鑰版)</h2>
    <button onclick="testAPI()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; font-weight: bold; border-radius: 8px; border: none; background: #1DB954; color: black;">點我呼叫天道</button>
    
    <p id="status" style="color: #888; margin-top: 20px; font-weight: bold; font-size: 18px;">等待測試...</p>
    <div id="result" style="background: #222; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; white-space: pre-wrap; min-height: 50px; border: 1px solid #444;"></div>

    <script>
        // 🔑 你的最新版高級金鑰 (AQ 開頭)
        const API_KEY = "AQ.Ab8RN6Izyjv8vW4dWNzgrzjqG293OVreAMh9-8r70Bg0o5_nkw"; 
        
        async function testAPI() {
            document.getElementById('status').innerText = "⏳ 傳送神念中...";
            document.getElementById('result').innerText = "";
            document.getElementById('status').style.color = "#ffd700";

            try {
                // 🌟 破陣關鍵 1：網址後面絕對不加 ?key=
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        // 🌟 破陣關鍵 2：把高級金鑰藏在 HTTP 標頭裡！
                        'x-goog-api-key': API_KEY 
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你好，這是一條測試訊息，請用一句話證明你收到了，並展現一下你身為天道的霸氣。" }] }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP 狀態碼: ${response.status}`);
                }

                const data = await response.json();
                
                document.getElementById('status').innerText = "✅ 呼叫成功！";
                document.getElementById('status').style.color = "#1DB954";
                document.getElementById('result').innerText = data.candidates[0].content.parts[0].text;

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "❌ 呼叫失敗！";
                document.getElementById('status').style.color = "#ff4b2b";
                document.getElementById('result').innerText = `錯誤原因：\n${error.message}`;
            }
        }
    </script>
</body>
</html>
