<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>天道金鑰測試儀</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; padding: 20px;">
    <h2>🔮 天道金鑰測試儀</h2>
    <button onclick="testAPI()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">點我呼叫天道</button>
    <p id="status" style="color: #888; margin-top: 20px;">等待測試...</p>
    <div id="result" style="background: #222; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; white-space: pre-wrap;"></div>

    <script>
        // 🔑 你的金鑰
        const API_KEY = "AQ.Ab8RN6Izyjv8vW4dWNzgrzjqG293OVreAMh9-8r70Bg0o5_nkw"; 
        
        async function testAPI() {
            document.getElementById('status').innerText = "⏳ 傳送神念中...";
            document.getElementById('result').innerText = "";
            document.getElementById('status').style.color = "#ffd700";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你好，這是一條測試訊息，請用一句話證明你收到了。" }] }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP 狀態碼: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('status').innerText = "✅ 呼叫成功！";
                document.getElementById('status').style.color = "#1DB954";
                document.getElementById('result').innerText = data.candidates[0].content.parts[0].text;

            } catch (error) {
                document.getElementById('status').innerText = "❌ 呼叫失敗！";
                document.getElementById('status').style.color = "#ff4b2b";
                document.getElementById('result').innerText = `錯誤原因：\n${error.message}`;
            }
        }
    </script>
</body>
</html>
